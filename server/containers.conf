# Podman of dev inside the server. There is no systemd, and /var/tmp is read-only.
[containers]
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
image_copy_tmp_dir = "storage"
# Docker Compose is the provider the image ships on purpose, no warning on every call.
compose_warning_logs = false
