name: vm

# Manual only, takes about 20 minutes. Day-to-day testing runs locally with ./test.sh.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, debian, ubuntu, archlinux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: QEMU
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends qemu-system-x86 qemu-utils
          sudo chmod 666 /dev/kvm

      - name: Isolation tests
        run: tests/vm.sh ${{ matrix.distro }}
