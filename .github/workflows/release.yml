name: release

# A tag runs every test (tests.yml), builds everything and drafts a release, which waits for ./sign-release.sh on the host.
# Images are pushed only from a published release: when it is published, and weekly from the
# latest one to pick up Debian security updates.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every test, about an hour, so a broken tag drafts nothing.
  tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/tests.yml

  draft:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: tests/unit.sh
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PODS_VERSION: ${{ github.ref_name }}
        run: |
          ./build.sh
          gh release create "$PODS_VERSION" --draft --verify-tag --generate-notes --title "$PODS_VERSION" \
            dist/op-client dist/op-server

  images:
    runs-on: ubuntu-latest
    env:
      IMAGE: jezeklu/orca-pods
    steps:
      - name: Release to build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          tag=${EVENT_TAG:-$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)}
          printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "date=$(date -u +%Y%m%d)"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          target: client
          tags: orca-pods:test

      - name: Build server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          target: server
          tags: orca-pods:server-test

      - name: Smoke test
        run: |
          docker run --rm orca-pods:test sh -ec '
            test "$(id -u dev)" = 30100
            tailscale version
            tailscaled --version
            command -v iptables
            command -v ip
            command -v orca-release
          '
          docker run --rm orca-pods:server-test sh -ec '
            test "$(id -u dev)" = 30100
            for tool in git gh mc htop curl jq rg gcc python3 uv mise node pnpm claude codex opencode \
              Xvfb tailscale orca-release orca-update orca-pair orca-runtimes git-credential-pods; do
              command -v "$tool"
            done
            /usr/bin/podman --version
            docker-compose version
            test "$(command -v podman)" = /usr/local/bin/podman
          '

      # A tag alone pushes nothing, the release is not signed yet.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest is what op-client v0.1.0 pulls.
      - name: Push
        if: github.event_name != 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: client
          push: true
          tags: |
            ${{ env.IMAGE }}:client
            ${{ env.IMAGE }}:client-${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:client-${{ steps.release.outputs.date }}
            ${{ env.IMAGE }}:latest

      - name: Push server
        if: github.event_name != 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          target: server
          push: true
          tags: |
            ${{ env.IMAGE }}:server
            ${{ env.IMAGE }}:server-${{ steps.release.outputs.version }}
            ${{ env.IMAGE }}:server-${{ steps.release.outputs.date }}
